_id: wDk3N7pQvRtZxL2b
name: Item-Migration erneut ausführen
type: script
author: m5HI1NMGmW1y9fyL
img: icons/svg/upgrade.svg
scope: global
command: >-
    game.splittermond.API.migrations.runItemMigration({ force: true }).then((result) => {
    ui.notifications.info(game.i18n.format("splittermond.migration.itemMigration.result", {
    worldItems: result.worldDocumentsMigrated,
    packs: result.packsMigrated,
    skipped: result.skippedPacks.length,
    }));
    if (result.skippedPacks.length > 0) {
    ui.notifications.info(game.i18n.format("splittermond.migration.itemMigration.skippedList", {
    packs: result.skippedPacks.join(", "),
    }));
    }
    });
